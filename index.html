<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registered Users</title>
    <style>
        body { font-family: Arial; background: #111; color: #fff; padding: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #555; padding: 10px; text-align: left; }
        th { background: #222; }
        tr:nth-child(even) { background: #1a1a1a; }
    </style>
</head>
<body>
    <h1>Connected / Registered Users</h1>
    <table>
        <thead>
            <tr>
                <th>Username</th>
                <th>Device ID</th>
                <th>App Version</th>
            </tr>
        </thead>
        <tbody>
            {% for device_id, info in users|dictsort %}
            <tr>
                <td>{{ info.username }}</td>
                <td>{{ device_id }}</td>
                <td>{{ info.version }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
