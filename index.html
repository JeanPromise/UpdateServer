<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login & Registration</title>
<style>
  * {margin:0; padding:0; box-sizing:border-box;}
  body {
    font-family: Arial, sans-serif;
    background:#121212;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
  }

  .container {
    background:#1e1e1e;
    padding:40px;
    border-radius:10px;
    width:350px;
    box-shadow: 0 0 20px rgba(0,0,0,0.7);
    position:relative;
    transition: transform 0.6s ease, opacity 0.6s ease;
  }

  h2 {text-align:center; margin-bottom:20px; color:#E50914;}
  form {display:flex; flex-direction:column;}
  input {
    margin-bottom:15px;
    padding:10px;
    border:none;
    border-radius:5px;
    font-size:16px;
  }
  input:focus {outline:none; border:2px solid #E50914;}
  button {
    padding:10px;
    border:none;
    border-radius:5px;
    background:#E50914;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
  }
  button:hover {background:#ff1a2c;}
  .toggle {
    text-align:center;
    margin-top:10px;
    cursor:pointer;
    color:#aaa;
  }
  .toggle:hover {color:#fff;}

  .disabled {
    pointer-events: none;
    opacity: 0.5;
  }

  /* Shrink/fade/explode animation */
  .explode {
    animation: explode 0.6s forwards;
  }

  @keyframes explode {
    0% {transform: scale(1) rotate(0deg); opacity:1;}
    50% {transform: scale(0.6) rotate(10deg); opacity:0.8;}
    100% {transform: scale(0) rotate(30deg); opacity:0;}
  }
</style>
</head>
<body>

<div class="container" id="container">
  <h2 id="form-title">Login</h2>
  
  <form id="login-form">
    <input type="email" placeholder="Email" required>
    <input type="password" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>

  <form id="register-form" style="display:none;">
    <input type="text" placeholder="Full Name" required>
    <input type="email" placeholder="Email" required>
    <input type="password" placeholder="Password" required>
    <input type="password" placeholder="Confirm Password" required>
    <button type="submit">Register</button>
  </form>

  <div class="toggle" id="toggle-form">Don't have an account? Register</div>
</div>

<script>
// Elements
const loginForm = document.getElementById('login-form');
const registerForm = document.getElementById('register-form');
const toggleForm = document.getElementById('toggle-form');
const formTitle = document.getElementById('form-title');
const container = document.getElementById('container');

// Toggle between login and register
toggleForm.addEventListener('click', () => {
  if (loginForm.style.display !== 'none') {
      loginForm.style.display = 'none';
      registerForm.style.display = 'flex';
      formTitle.textContent = 'Register';
      toggleForm.textContent = 'Already have an account? Login';
  } else {
      loginForm.style.display = 'flex';
      registerForm.style.display = 'none';
      formTitle.textContent = 'Login';
      toggleForm.textContent = "Don't have an account? Register";
  }
});

// -------- Helper: disable forms --------
function disableForms(message, apkUrl) {
  container.classList.add('disabled');
  container.innerHTML = `
    <h2 style="text-align:center; color:#ff3e3e">${message}</h2>
    <a href="${apkUrl}" style="display:block; margin-top:20px; text-align:center; color:#fff; text-decoration:none; font-weight:bold; border:2px solid #fff; padding:10px; border-radius:5px;">Download APK</a>
  `;
}

// -------- Check latest APK --------
async function checkApkVersion() {
  try {
    const res = await fetch('/apk/latest');
    const data = await res.json();

    if (!data.version) return; // no APK uploaded yet

    const userVersion = localStorage.getItem('apkVersion');
    if (userVersion !== data.version) {
      // User must update
      disableForms('New APK available!', `/apk/${data.filename}`);
    }
  } catch(err) {
    console.error('Failed to check APK version', err);
  }
}

// -------- Handle login --------
loginForm.addEventListener('submit', async e => {
  e.preventDefault();
  const email = loginForm.querySelector('input[type="email"]').value;
  const password = loginForm.querySelector('input[type="password"]').value;

  try {
    const res = await fetch('/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email, password})
    });
    const data = await res.json();
    if (data.success) {
      animateAndDisappear();
    } else {
      alert(data.error);
    }
  } catch(err) {
    console.error(err);
    alert('Login failed');
  }
});

// -------- Handle registration --------
registerForm.addEventListener('submit', async e => {
  e.preventDefault();
  const name = registerForm.querySelector('input[placeholder="Full Name"]').value;
  const email = registerForm.querySelector('input[type="email"]').value;
  const password = registerForm.querySelector('input[placeholder="Password"]').value;
  const confirm = registerForm.querySelector('input[placeholder="Confirm Password"]').value;

  if (password !== confirm) {
    alert('Passwords do not match!');
    return;
  }

  try {
    const res = await fetch('/register', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name, email, password})
    });
    const data = await res.json();
    if (data.success) {
      animateAndDisappear();
    } else {
      alert(data.error);
    }
  } catch(err) {
    console.error(err);
    alert('Registration failed');
  }
});

// -------- Animation --------
function animateAndDisappear() {
  container.classList.add('explode');
  container.addEventListener('animationend', () => {
    container.style.display = 'none';
    if (window.AndroidBridge) window.AndroidBridge.loginSuccess();
  }, {once:true});
}

// -------- Init --------
checkApkVersion();

</script>
</body>
</html>
