<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Login & Registration</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:Arial,sans-serif;background:#121212;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden}
  .container{background:#1e1e1e;padding:40px;border-radius:10px;width:350px;box-shadow:0 0 20px rgba(0,0,0,.7);position:relative;transition:transform .6s ease,opacity .6s ease}
  h2{text-align:center;margin-bottom:20px;color:#E50914}
  form{display:flex;flex-direction:column}
  input{margin-bottom:15px;padding:10px;border:0;border-radius:5px;font-size:16px}
  input:focus{outline:none;border:2px solid #E50914}
  button{padding:10px;border:0;border-radius:5px;background:#E50914;color:#fff;font-weight:700;cursor:pointer;transition:.2s}
  button:hover{background:#ff1a2c}
  .toggle{text-align:center;margin-top:10px;cursor:pointer;color:#aaa}
  .toggle:hover{color:#fff}
  .explode{animation:explode .6s forwards}
  @keyframes explode{0%{transform:scale(1) rotate(0);opacity:1}50%{transform:scale(.6) rotate(10deg);opacity:.8}100%{transform:scale(0) rotate(30deg);opacity:0}}

  .disabled-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);display:flex;justify-content:center;align-items:center;flex-direction:column;text-align:center;color:#ffb3b3;font-size:18px;z-index:10;border-radius:10px;padding:20px}
  .disabled-overlay button{margin-top:15px;background:#4CAF50;cursor:pointer;padding:10px 16px;border-radius:6px;border:0}

  /* In-page store (kept but downloads open externally) */
  #store{position:fixed;top:0;left:0;width:100vw;height:100vh;background:linear-gradient(180deg,#0f0f0f,#171717);display:none;justify-content:center;align-items:flex-start;padding:40px;overflow:auto}
  .store-inner{width:920px;max-width:95%;margin-top:40px}
  .store-header{display:flex;align-items:center;justify-content:space-between;color:#fff;margin-bottom:16px}
  .store-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
  .app-card{background:#1f1f1f;padding:18px;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.6)}
  .app-title{font-size:18px;color:#E50914;margin-bottom:8px}
  .app-desc{color:#ccc;font-size:14px;min-height:42px;margin-bottom:12px}
  .app-meta{font-size:13px;color:#999;margin-bottom:12px}
  .app-actions{display:flex;gap:8px}
  .btn-primary{background:#E50914;color:#fff;border:0;padding:8px 12px;border-radius:6px;cursor:pointer}
  .btn-secondary{background:transparent;border:1px solid #444;color:#fff;padding:8px 12px;border-radius:6px;cursor:pointer}
  .back-store{background:transparent;border:1px solid #444;color:#fff;padding:8px 12px;border-radius:6px;cursor:pointer}
  .proceed-btn{padding:10px 20px;font-size:16px;background:#E50914;color:#fff;border-radius:6px;border:0;cursor:pointer}
  @media (max-width:520px){.container{width:92%;padding:20px}.store-inner{margin-top:24px}}
</style>
</head>
<body>

<!-- login/register -->
<div class="container" id="container">
  <h2 id="form-title">Login</h2>

  <form id="login-form">
    <input type="email" placeholder="Email" required>
    <input type="password" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>

  <form id="register-form" style="display:none">
    <input type="text" placeholder="Full Name" required>
    <input type="email" placeholder="Email" required>
    <input type="password" placeholder="Password" required>
    <input type="password" placeholder="Confirm Password" required>
    <button type="submit">Register</button>
  </form>

  <div class="toggle" id="toggle-form">Don't have an account? Register</div>
</div>

<!-- in-page store (kept as fallback, but downloads open externally) -->
<div id="store" role="dialog" aria-hidden="true">
  <div class="store-inner">
    <div class="store-header">
      <div style="font-size:20px;color:#fff">Our Apps</div>
      <div><button class="back-store" id="backToLogin">Back</button></div>
    </div>

    <div id="store-grid" class="store-grid"></div>
    <div style="height:60px"></div>
  </div>
</div>

<script>
/* preserved UI state */
const loginForm = document.getElementById('login-form');
const registerForm = document.getElementById('register-form');
const toggleForm = document.getElementById('toggle-form');
const formTitle = document.getElementById('form-title');
const container = document.getElementById('container');

let currentUserApkVersion = '0.0.0'; // native can update this via JS bridge if needed
let updateInfo = null;

// toggle
toggleForm.addEventListener('click', () => {
  if (loginForm.style.display !== 'none') {
    loginForm.style.display = 'none';
    registerForm.style.display = 'flex';
    formTitle.textContent = 'Register';
    toggleForm.textContent = 'Already have an account? Login';
  } else {
    loginForm.style.display = 'flex';
    registerForm.style.display = 'none';
    formTitle.textContent = 'Login';
    toggleForm.textContent = "Don't have an account? Register";
  }
});

/* ---------- openExternal: tries Chrome via intent://, fallback to window.open ----------
   This attempts to force opening an external browser (Chrome). If Chrome isn't installed
   it fallsback to window.open('_blank'), which many WebViews hand off to external browser.
---------------------------------------------------------------------------------- */
function openExternal(url) {
  if (!url) return;
  try {
    // build an intent:// url that targets Chrome if available
    // remove protocol from original url and attach as path
    const withoutProto = url.replace(/^https?:\/\//i, '');
    const intentUrl = 'intent://' + withoutProto + '#Intent;scheme=https;package=com.android.chrome;end';
    // navigate to intent -> if Chrome exists it will open
    window.location.href = intentUrl;
    // fallback: after a short delay, open normally (will either open external or in-app)
    setTimeout(() => {
      try { window.open(url, '_blank', 'noopener'); } catch (e) { window.location.href = url; }
    }, 700);
  } catch (e) {
    try { window.open(url, '_blank', 'noopener'); } catch (err) { window.location.href = url; }
  }
}

/* ====== Update check ====== */
async function checkUpdate() {
  try {
    const res = await fetch('/check_update');
    if (!res.ok) return;
    const data = await res.json();
    updateInfo = data || null;

    if (data && data.apk_version && data.apk_version !== currentUserApkVersion) {
      const overlay = document.createElement('div');
      overlay.className = 'disabled-overlay';
      overlay.id = 'updateOverlay';
      overlay.innerHTML = `
        <div>New APK version <strong>${escapeHtml(data.apk_version)}</strong> is available.<br>
        Please download and install it to continue.</div>
        <div style="margin-top:12px;font-size:13px;color:#ddd">Open our App Store in your browser to install.</div>
        <button id="openStoreBtn">Open Our Apps (Browser)</button>
      `;
      container.appendChild(overlay);

      document.getElementById('openStoreBtn').addEventListener('click', () => {
        // open the external store URL in a browser (leave the app)
        const storeUrl = (updateInfo && updateInfo.store_url) ? updateInfo.store_url : 'https://jeanpromise.github.io/UpdateServer/';
        openExternal(storeUrl);
      });
    }
  } catch (err) {
    console.warn('update check failed', err);
  }
}

/* ====== Store UI (kept but downloads open externally) ====== */
const store = document.getElementById('store');
const storeGrid = document.getElementById('store-grid');
const backToLogin = document.getElementById('backToLogin');

function showStoreInApp() {
  container.style.display = 'none';
  renderStore();
  store.style.display = 'flex';
  store.setAttribute('aria-hidden','false');
}
function hideStore() {
  store.style.display = 'none';
  store.setAttribute('aria-hidden','true');
  container.style.display = 'block';
}
backToLogin.addEventListener('click', () => {
  const ov = document.getElementById('updateOverlay');
  if (ov) ov.remove();
  hideStore();
});

function renderStore(){
  let apps = [];
  if (updateInfo && Array.isArray(updateInfo.apps) && updateInfo.apps.length) {
    apps = updateInfo.apps;
  } else if (updateInfo && updateInfo.apk_url) {
    apps = [{ id:'app-debug', title:'TomorrowLand', version:updateInfo.apk_version||'latest', description:'Official app — download via browser.', url:updateInfo.apk_url }];
  } else {
    apps = [{ id:'app-debug', title:'TomorrowLand', version:'unknown', description:'App listing — download from browser.', url:'https://raw.githubusercontent.com/Jeanpromise/UpdateServer/main/apks/app-debug.apk' }];
  }

  storeGrid.innerHTML = '';
  apps.forEach(a=>{
    const card = document.createElement('div');
    card.className = 'app-card';
    card.innerHTML = `
      <div class="app-title">${escapeHtml(a.title)}</div>
      <div class="app-desc">${escapeHtml(a.description||'')}</div>
      <div class="app-meta">Version: <strong>${escapeHtml(a.version||'—')}</strong></div>
      <div class="app-actions">
         <button class="btn-primary" data-url="${escapeHtml(a.url)}">Download (Browser)</button>
         <button class="btn-secondary" data-id="${escapeHtml(a.id)}">Details</button>
      </div>
    `;
    storeGrid.appendChild(card);

    // Download opens external browser (leaves app)
    const dlBtn = card.querySelector('.btn-primary');
    dlBtn.addEventListener('click', (ev) => {
      const url = ev.currentTarget.getAttribute('data-url');
      if (!url) return alert('Download URL missing.');
      openExternal(url);
    });

    const infoBtn = card.querySelector('.btn-secondary');
    infoBtn.addEventListener('click', ()=> alert(`${a.title}\nVersion: ${a.version}\n\n${a.description||''}`));
  });
}

/* ====== Animate container and show Proceed button ====== */
function animateAndDisappear(){
  container.classList.add('explode');
  container.addEventListener('animationend', ()=>{
    container.style.display = 'none';
    const proceedBtn = document.createElement('button');
    proceedBtn.textContent = 'Proceed to Shows';
    proceedBtn.className = 'proceed-btn';
    proceedBtn.style.position = 'fixed';
    proceedBtn.style.top = '50%';
    proceedBtn.style.left = '50%';
    proceedBtn.style.transform = 'translate(-50%,-50%)';
    document.body.appendChild(proceedBtn);

    proceedBtn.addEventListener('click', ()=>{
      if (window.AndroidBridge && AndroidBridge.openGoojaraPage) {
        AndroidBridge.openGoojaraPage();
      } else {
        alert('Bridge not available.');
      }
    });
  }, {once:true});
}

/* ====== Login/Register handlers (preserved) ====== */
loginForm.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const email = loginForm[0].value.trim();
  const password = loginForm[1].value.trim();
  try {
    const res = await fetch('/login',{ method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email,password,apk_version:currentUserApkVersion}) });
    const data = await res.json();
    if (data.success) {
      // you may receive updateInfo from server here (optional)
      // updateInfo = data.update || updateInfo;
      animateAndDisappear();
    } else alert(data.message || 'Login failed');
  } catch (err) { alert('Network error'); }
});

registerForm.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const name = registerForm[0].value.trim();
  const email = registerForm[1].value.trim();
  const password = registerForm[2].value.trim();
  const confirm = registerForm[3].value.trim();
  if (password !== confirm) return alert('Passwords do not match!');
  try {
    const res = await fetch('/register',{ method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name,email,password}) });
    const data = await res.json();
    if (data.success) {
      alert('Registration successful! Please log in.');
      registerForm.style.display='none';
      loginForm.style.display='flex';
      formTitle.textContent='Login';
      toggleForm.textContent="Don't have an account? Register";
    } else alert(data.message || 'Registration failed');
  } catch (err) { alert('Network error'); }
});

/* utility */
function escapeHtml(s){ if(!s) return ''; return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* initial update check */
checkUpdate();
</script>
</body>
</html>
