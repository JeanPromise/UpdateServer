<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
body { font-family: Arial, sans-serif; background:#111; color:#fff; margin:0; padding:20px;}
h1 { color: #ffcc00; }
button { padding:10px 15px; margin:5px; background:#222; color:#ffcc00; border:none; cursor:pointer; }
button:hover { background:#444; }
table { width:100%; border-collapse: collapse; margin-top:20px; }
th, td { border:1px solid #555; padding:8px; text-align:left; }
th { background:#222; }
td { background:#111; }
</style>
</head>
<body>
<h1>Upload APK</h1>
<form id="apkForm">
<input type="file" name="apk" id="apkFile" accept=".apk">
<button type="submit">Upload</button>
</form>
<p>Current Version: <span id="apkVersion">1</span></p>

<h2>Connected Users</h2>
<table>
<thead>
<tr><th>Device ID</th><th>Version</th><th>Connected At</th></tr>
</thead>
<tbody id="userTable"></tbody>
</table>

<script>
const socket = io();
const apkVersion = document.getElementById("apkVersion");
const userTable = document.getElementById("userTable");
const form = document.getElementById("apkForm");

form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const file = document.getElementById("apkFile").files[0];
    if(!file) return alert("Select an APK first");
    const formData = new FormData();
    formData.append("apk", file);
    const res = await fetch("/upload_apk", { method:"POST", body: formData });
    const data = await res.json();
    apkVersion.textContent = data.version;
});

// Socket events
socket.on("connect", () => console.log("Connected to server"));
socket.on("disconnect", () => console.log("Disconnected from server"));

socket.on("apk_update", (data) => {
    apkVersion.textContent = data.version;
});

socket.on("users_update", (users) => {
    userTable.innerHTML = "";
    users.forEach(u => {
        const row = document.createElement("tr");
        row.innerHTML = `<td>${u.device_id}</td><td>${u.version}</td><td>${u.connected_at}</td>`;
        userTable.appendChild(row);
    });
});
</script>
</body>
</html>
