<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
<style>
body { font-family: Arial; background:#111; color:#eee; margin:0; padding:0;}
header { padding:10px; background:#222; text-align:center; font-size:24px; }
.device { background:#333; padding:10px; margin:10px; border-radius:6px; display:flex; justify-content:space-between; }
button { padding:5px 10px; background:#f90; border:none; color:#111; cursor:pointer; border-radius:4px; }
button:hover { background:#ffb000; }
</style>
</head>
<body>
<header>Admin Dashboard</header>
<div id="device-list">
    {% for device in devices %}
    <div class="device" id="{{device}}">
        <span>{{device}}</span>
        <button onclick="sendUpdate('{{device}}')">Update APK</button>
        <button onclick="sendInfo('{{device}}')">Get Info</button>
    </div>
    {% endfor %}
</div>

<script>
function sendUpdate(device) {
    fetch(`/send/${device}/update_apk`).then(r=>r.text()).then(alert);
}
function sendInfo(device) {
    fetch(`/send/${device}/get_device_info`).then(r=>r.text()).then(alert);
}

// Auto-refresh device list every 5 seconds
setInterval(()=>location.reload(), 5000);
</script>
</body>
</html>
