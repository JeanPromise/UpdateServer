<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #2b2b2b;
            padding: 20px;
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
        }
        section {
            padding: 20px;
        }
        .apk-section, .users-section, .log-section {
            background-color: #2b2b2b;
            border-radius: 8px;
            margin-bottom: 20px;
            padding: 20px;
        }
        button {
            background-color: #ffcc00;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
            color: #000;
        }
        button:hover {
            background-color: #ffaa00;
        }
        input[type="file"] {
            padding: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #444;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #333;
        }
        #log {
            height: 200px;
            overflow-y: scroll;
            background-color: #121212;
            padding: 10px;
            font-family: monospace;
            font-size: 0.9em;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <header>Admin Panel</header>
    <section class="apk-section">
        <h2>Upload APK</h2>
        <form id="apkForm">
            <input type="file" name="apk" id="apkFile" accept=".apk" required>
            <button type="submit">Upload</button>
        </form>
        <p>Current Version: <span id="apkVersion">1</span></p>
        <p>Current File: <span id="apkFileName">None</span></p>
    </section>

    <section class="users-section">
        <h2>Connected Devices / Users</h2>
        <table>
            <thead>
                <tr>
                    <th>Device ID</th>
                    <th>Version</th>
                    <th>Connected At (UTC)</th>
                </tr>
            </thead>
            <tbody id="usersTable">
                <!-- Users will populate here -->
            </tbody>
        </table>
    </section>

    <section class="log-section">
        <h2>Live Logs</h2>
        <div id="log"></div>
    </section>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io();

        const apkVersionEl = document.getElementById("apkVersion");
        const apkFileNameEl = document.getElementById("apkFileName");
        const usersTable = document.getElementById("usersTable");
        const logEl = document.getElementById("log");
        const apkForm = document.getElementById("apkForm");

        // Live logs helper
        function log(msg) {
            const time = new Date().toLocaleTimeString();
            logEl.innerHTML += `[${time}] ${msg}<br>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        // Render users table
        function renderUsers(users) {
            usersTable.innerHTML = "";
            users.forEach(user => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${user.device_id}</td>
                    <td>${user.version}</td>
                    <td>${user.connected_at}</td>
                `;
                usersTable.appendChild(tr);
            });
        }

        // Handle APK updates
        socket.on("apk_update", data => {
            apkVersionEl.textContent = data.version;
            apkFileNameEl.textContent = data.filename || "None";
            log(`APK Updated: v${data.version} (${data.filename})`);
        });

        // Handle users updates
        socket.on("users_update", users => {
            renderUsers(users);
            log(`Users list updated (${users.length} devices)`);
        });

        // Connect / disconnect
        socket.on("connect", () => log("Connected to server"));
        socket.on("disconnect", () => log("Disconnected from server"));

        // Upload APK
        apkForm.addEventListener("submit", async e => {
            e.preventDefault();
            const file = document.getElementById("apkFile").files[0];
            if (!file) return alert("Select an APK file first");
            const formData = new FormData();
            formData.append("apk", file);

            try {
                const resp = await fetch("/upload_apk", {
                    method: "POST",
                    body: formData
                });
                const data = await resp.json();
                log(`Uploaded APK: v${data.version} (${data.filename})`);
            } catch (err) {
                log(`Upload failed: ${err}`);
            }
        });

        // Load initial users & APK info on page load
        async function loadInitialData() {
            try {
                const usersResp = await fetch("/users");
                const usersData = await usersResp.json();
                renderUsers(usersData);

                const apkResp = await fetch("/apk_info");
                const apkData = await apkResp.json();
                apkVersionEl.textContent = apkData.version;
                apkFileNameEl.textContent = apkData.filename || "None";
            } catch (err) {
                log(`Error loading initial data: ${err}`);
            }
        }

        loadInitialData();
    </script>
</body>
</html>
