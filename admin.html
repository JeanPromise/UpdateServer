<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Contact Us</title>
<style>
  body { font-family: Arial, sans-serif; background:#121212; color:#fff; padding:20px; }
  h1, h2 { color:#E50914; margin-bottom:10px; }
  table { width:100%; border-collapse:collapse; margin-top:20px; }
  th, td { padding:10px; border:1px solid #333; text-align:left; }
  th { background:#1e1e1e; }
  tr:nth-child(even) { background:#1a1a1a; }
  button { padding:5px 10px; border:none; border-radius:5px; cursor:pointer; font-weight:bold; margin:2px; }
  .enable { background:#4CAF50; color:#fff; }
  .disable { background:#f44336; color:#fff; }
  .user-list { float:left; width:30%; max-height:80vh; overflow-y:auto; border-right:1px solid #333; padding-right:10px; }
  .message-area { float:left; width:65%; padding-left:20px; max-height:80vh; overflow-y:auto; }
  .message { background:#1e1e1e; padding:10px; margin-bottom:10px; border-radius:5px; }
  .message.user { background:#333; }
  textarea { width:100%; padding:10px; border-radius:5px; border:none; resize:none; margin-top:10px; }
  #reply-btn { background:#4CAF50; margin-top:5px; }
  .clearfix::after { content:""; clear:both; display:table; }
</style>
</head>
<body>

<h1>Admin Dashboard</h1>

<h2>Users Messages</h2>
<div class="clearfix">
  <div class="user-list">
    <ul id="user-list-ul" style="list-style:none; padding-left:0;"></ul>
  </div>
  <div class="message-area">
    <h3 id="selected-user-title">Select a user to view messages</h3>
    <div id="messages-container"></div>
    <textarea id="reply-text" rows="3" placeholder="Type your reply..."></textarea>
    <button id="reply-btn">Send Reply</button>
  </div>
</div>

<script>
// ----- Load users who sent messages -----
let selectedUserEmail = null;

async function loadUsers() {
  const res = await fetch('/get_users');
  const users = await res.json();
  const ul = document.getElementById('user-list-ul');
  ul.innerHTML = '';
  users.forEach(u => {
    const li = document.createElement('li');
    li.style.padding='5px';
    li.style.cursor='pointer';
    li.style.borderBottom='1px solid #333';
    li.textContent = u.name + ' ('+u.email+')';
    li.addEventListener('click', () => selectUser(u.email, u.name));
    ul.appendChild(li);
  });
}

// ----- Select user and load messages -----
async function selectUser(email, name) {
  selectedUserEmail = email;
  document.getElementById('selected-user-title').textContent = 'Messages with ' + name;
  const res = await fetch('/get_messages?email=' + encodeURIComponent(email));
  const messages = await res.json();
  const container = document.getElementById('messages-container');
  container.innerHTML = '';
  messages.forEach(m => {
    const div = document.createElement('div');
    div.className = 'message ' + (m.from === 'user' ? 'user' : 'admin');
    div.innerHTML = `<b>${m.from === 'user' ? 'User' : 'Admin'}:</b> ${m.text}<br><small>${m.time}</small>`;
    container.appendChild(div);
  });
  container.scrollTop = container.scrollHeight;
}

// ----- Send reply -----
document.getElementById('reply-btn').addEventListener('click', async () => {
  const text = document.getElementById('reply-text').value.trim();
  if(!selectedUserEmail) return alert('Select a user first.');
  if(!text) return alert('Type your reply.');
  const res = await fetch('/reply_message', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({email:selectedUserEmail, text})
  });
  const data = await res.json();
  if(data.success){
    document.getElementById('reply-text').value='';
    selectUser(selectedUserEmail, selectedUserEmail); // refresh messages
  }
});

// ----- Initial load -----
loadUsers();
</script>

</body>
</html>
