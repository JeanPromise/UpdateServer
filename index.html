<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login & Registration</title>
<style>
  * {margin:0; padding:0; box-sizing:border-box;}
  body {font-family: Arial, sans-serif; background:#121212; color:#fff; display:flex; justify-content:center; align-items:center; height:100vh; overflow:hidden;}
  
  .container {
    background:#1e1e1e; padding:40px; border-radius:10px; width:350px;
    box-shadow: 0 0 20px rgba(0,0,0,0.7); position:relative;
    transition: transform 0.6s ease, opacity 0.6s ease;
  }

  h2 {text-align:center; margin-bottom:20px; color:#E50914;}
  form {display:flex; flex-direction:column;}
  input {margin-bottom:15px; padding:10px; border:none; border-radius:5px; font-size:16px;}
  input:focus {outline:none; border:2px solid #E50914;}
  button {padding:10px; border:none; border-radius:5px; background:#E50914; color:#fff; font-weight:bold; cursor:pointer; transition:0.2s;}
  button:hover {background:#ff1a2c;}
  .toggle {text-align:center; margin-top:10px; cursor:pointer; color:#aaa;}
  .toggle:hover {color:#fff;}

  /* Shrink/fade/explode animation */
  .explode {
    animation: explode 0.6s forwards;
  }

  @keyframes explode {
    0% {transform: scale(1) rotate(0deg); opacity:1;}
    50% {transform: scale(0.6) rotate(10deg); opacity:0.8;}
    100% {transform: scale(0) rotate(30deg); opacity:0;}
  }
</style>
</head>
<body>

<div class="container" id="container">
  <h2 id="form-title">Login</h2>
  
  <form id="login-form">
    <input type="email" placeholder="Email" required>
    <input type="password" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>

  <form id="register-form" style="display:none;">
    <input type="text" placeholder="Full Name" required>
    <input type="email" placeholder="Email" required>
    <input type="password" placeholder="Password" required>
    <input type="password" placeholder="Confirm Password" required>
    <button type="submit">Register</button>
  </form>

  <div class="toggle" id="toggle-form">Don't have an account? Register</div>
</div>

<script>
const loginForm = document.getElementById('login-form');
const registerForm = document.getElementById('register-form');
const toggleForm = document.getElementById('toggle-form');
const formTitle = document.getElementById('form-title');
const container = document.getElementById('container');

toggleForm.addEventListener('click', () => {
    if(loginForm.style.display !== 'none'){
        loginForm.style.display = 'none';
        registerForm.style.display = 'flex';
        formTitle.textContent = 'Register';
        toggleForm.textContent = 'Already have an account? Login';
    } else {
        loginForm.style.display = 'flex';
        registerForm.style.display = 'none';
        formTitle.textContent = 'Login';
        toggleForm.textContent = "Don't have an account? Register";
    }
});

// ===== Login submit =====
loginForm.addEventListener('submit', (e) => {
    e.preventDefault();
    animateAndDisappear();
});

// ===== Registration submit =====
registerForm.addEventListener('submit', (e) => {
    e.preventDefault();
    animateAndDisappear();
});

function animateAndDisappear() {
    container.classList.add('explode');

    container.addEventListener('animationend', () => {
        // Just hide the container completely
        container.style.display = 'none';
    }, {once:true});
}
</script>

</body>
</html>
