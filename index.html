<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<style>
body { font-family: Arial; background: #111; color: #fff; padding: 20px; }
h1 { color: #ffcc00; }
button { padding: 10px 20px; margin: 5px; cursor: pointer; background: #222; color: #ffcc00; border: 1px solid #ffcc00; }
input[type=file] { margin: 10px 0; }
#users, #online { margin-top: 20px; }
a.apk-link { color: #00ccff; text-decoration: none; }
</style>
</head>
<body>

<h1>Admin Panel</h1>

<h2>1️⃣ Upload APK</h2>
<input type="file" id="apkInput">
<button onclick="uploadAPK()">Upload</button>
<div id="apkResult"></div>

<h2>2️⃣ Registered Users</h2>
<button onclick="loadUsers()">Refresh Users</button>
<pre id="users">No data yet</pre>

<h2>3️⃣ Online Users</h2>
<button onclick="loadOnline()">Refresh Online</button>
<pre id="online">No data yet</pre>

<script>
async function uploadAPK() {
    const fileInput = document.getElementById('apkInput');
    if (!fileInput.files.length) return alert('Select an APK first!');
    const formData = new FormData();
    formData.append('apk', fileInput.files[0]);
    const res = await fetch('/upload_apk', { method: 'POST', body: formData });
    const data = await res.json();
    if (data.status === 'success') {
        document.getElementById('apkResult').innerHTML = 
            `Uploaded! Version: ${data.version} <br> <a class="apk-link" href="${data.url}" target="_blank">Download APK</a>`;
    } else {
        document.getElementById('apkResult').innerText = data.message;
    }
}

async function loadUsers() {
    const res = await fetch('/users');
    const data = await res.json();
    document.getElementById('users').innerText = JSON.stringify(data, null, 2);
}

async function loadOnline() {
    const res = await fetch('/online');
    const data = await res.json();
    document.getElementById('online').innerText = JSON.stringify(data, null, 2);
}
</script>

</body>
</html>
