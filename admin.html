<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<style>
body {
  font-family: Arial, sans-serif;
  background:#121212;
  color:#fff;
  margin:0; padding:0;
}
.container {
  max-width:800px;
  margin:20px auto;
  background:#1e1e1e;
  padding:20px;
  border-radius:10px;
}
h2 {color:#E50914;}
input, button, select {
  padding:10px;
  margin:5px 0;
  border-radius:5px;
  border:none;
  font-size:16px;
}
button {background:#E50914; color:#fff; cursor:pointer;}
button:hover {background:#ff1a2c;}
table {width:100%; border-collapse:collapse; margin-top:20px;}
th, td {padding:10px; border-bottom:1px solid #333; text-align:left;}
.toggle-btn {cursor:pointer; padding:5px 10px; border-radius:5px; background:#555;}
.toggle-btn.enabled {background:green;}
.toggle-btn.disabled {background:red;}
</style>
</head>
<body>

<div class="container">
  <h2>Upload New APK</h2>
  <form id="apk-form">
    <input type="file" name="apk" accept=".apk" required>
    <input type="text" name="version" placeholder="Version e.g. 1.0.2" required>
    <button type="submit">Upload APK</button>
  </form>

  <h2>Users</h2>
  <button id="enable-all">Enable All</button>
  <button id="disable-all">Disable All</button>
  <table id="users-table">
    <thead>
      <tr><th>Name</th><th>Email</th><th>Status</th><th>Action</th></tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
// Load users from server
async function loadUsers() {
    const res = await fetch('/users');
    const users = await res.json();
    const tbody = document.querySelector('#users-table tbody');
    tbody.innerHTML = '';
    users.forEach((u,i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${u.name}</td>
            <td>${u.email}</td>
            <td>${u.enabled ? 'Enabled' : 'Disabled'}</td>
            <td><button class="toggle-btn ${u.enabled ? 'enabled':'disabled'}" data-index="${i}">
                ${u.enabled ? 'Disable' : 'Enable'}
            </button></td>
        `;
        tbody.appendChild(tr);
    });
    attachToggleButtons();
}

function attachToggleButtons() {
    document.querySelectorAll('.toggle-btn').forEach(btn => {
        btn.onclick = async () => {
            const index = btn.dataset.index;
            await fetch(`/toggle_user/${index}`, {method:'POST'});
            loadUsers();
        };
    });
}

document.getElementById('enable-all').onclick = async () => {
    await fetch('/enable_all', {method:'POST'});
    loadUsers();
};

document.getElementById('disable-all').onclick = async () => {
    await fetch('/disable_all', {method:'POST'});
    loadUsers();
};

// APK upload
document.getElementById('apk-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const res = await fetch('/upload_apk', {method:'POST', body: formData});
    const data = await res.json();
    alert(data.msg);
});

loadUsers();
</script>
</body>
</html>
