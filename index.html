<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tomorrow Movies</title>
<style>
  /* ===== Reset & Base ===== */
  * {margin:0; padding:0; box-sizing:border-box;}
  body {background:#000; color:#fff; font-family:'Arial', sans-serif; overflow-x:hidden;}
  a {text-decoration:none; color:inherit;}
  button {cursor:pointer;}

  /* ===== Header ===== */
  header {
    position: fixed; top:0; left:0; width:100%; height:60px;
    background: rgba(0,0,0,0.85); display:flex; justify-content:space-between; align-items:center;
    padding:0 30px; z-index:1000;
  }
  header h1 {color:#E50914; font-size:28px;}
  header nav a {margin-left:20px; font-weight:bold; transition:0.2s;}
  header nav a:hover {color:#E50914;}

  /* ===== Hero ===== */
  .hero {
    margin-top:60px; height:70vh; position:relative;
    background-image:url('https://picsum.photos/1600/900?blur=3');
    background-size:cover; background-position:center;
    display:flex; align-items:flex-end; padding:40px;
  }
  .hero h2 {font-size:56px; text-shadow:3px 3px 12px #000;}

  /* ===== Sections ===== */
  .section {padding:20px 30px;}
  .section h3 {font-size:24px; margin-bottom:10px;}

  /* ===== Movies Row ===== */
  .movies-row {display:flex; overflow-x:auto; gap:12px; padding-bottom:10px;}
  .movies-row::-webkit-scrollbar {height:8px;}
  .movies-row::-webkit-scrollbar-thumb {background:#E50914; border-radius:4px;}

  .movie-card {
    min-width:200px; height:300px; background-size:cover; background-position:center;
    border-radius:8px; flex-shrink:0; position:relative; transition: transform 0.3s;
  }
  .movie-card:hover {transform: scale(1.1);}

  .movie-overlay {
    position:absolute; bottom:0; width:100%; padding:10px;
    background:linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0));
    border-radius:0 0 8px 8px; display:flex; justify-content:center;
  }
  .watch-btn {
    background:#E50914; border:none; padding:6px 12px; font-weight:bold; border-radius:4px;
    color:#fff; transition:0.2s;
  }
  .watch-btn:hover {background:#ff1a2c;}

  /* ===== Footer ===== */
  footer {
    text-align:center; padding:30px; color:#888; background:#111; margin-top:20px;
  }

  /* ===== Hover Effects ===== */
  .movie-card::after {
    content:''; position:absolute; top:0; left:0; width:100%; height:100%;
    border-radius:8px; background:rgba(0,0,0,0.1); opacity:0; transition:opacity 0.3s;
  }
  .movie-card:hover::after {opacity:0.3;}
</style>
</head>
