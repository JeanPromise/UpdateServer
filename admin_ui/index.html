<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>📊 Admin Dashboard</h1>
  <p>Welcome, <span id="admin-name">Admin</span></p>

  <div class="stats">
    <p><b>Total Users:</b> <span id="users">0</span></p>
    <p><b>Devices Installed:</b> <span id="devices">0</span></p>
    <p><b>Last APK Upload:</b> <span id="last-upload">None</span></p>
  </div>

  <h2>Upload New APK</h2>
  <form id="upload-form">
    <input type="file" name="apk" accept=".apk" required />
    <button type="submit">Upload</button>
  </form>

  <h2>Growth Report</h2>
  <canvas id="reportChart"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script>
</body>
</html>
