<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin APK Upload</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #222;
            padding: 20px;
            text-align: center;
            font-size: 1.5em;
        }
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 40px auto;
            width: 80%;
            max-width: 500px;
        }
        input[type="file"] {
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            background-color: #f39c12;
            border: none;
            color: #fff;
            font-size: 1em;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.2s;
        }
        button:hover {
            background-color: #e67e22;
        }
        .version {
            margin: 20px 0;
            font-size: 1.2em;
            color: #2ecc71;
        }
        .log {
            width: 100%;
            max-height: 300px;
            overflow-y: auto;
            background-color: #222;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
        }
        .log p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <header>Admin APK Management</header>
    <main>
        <form id="uploadForm">
            <input type="file" id="apkFile" accept=".apk" required>
            <button type="submit">Upload APK</button>
        </form>
        <div class="version">Current Version: <span id="currentVersion">-</span></div>
        <div class="log" id="log"></div>
    </main>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const logEl = document.getElementById('log');
        const versionEl = document.getElementById('currentVersion');
        const uploadForm = document.getElementById('uploadForm');
        const apkFileInput = document.getElementById('apkFile');

        const socket = io(window.location.origin);

        socket.on('connect', () => {
            log('Connected to server');
        });

        socket.on('apk_update', (data) => {
            if (data.version) {
                versionEl.textContent = data.version;
                log(`APK Version updated: v${data.version}`);
            }
            if (data.filename) {
                log(`New APK uploaded: ${data.filename}`);
            }
        });

        socket.on('disconnect', () => {
            log('Disconnected from server');
        });

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!apkFileInput.files.length) return alert('Select an APK first!');

            const formData = new FormData();
            formData.append('apk', apkFileInput.files[0]);

            try {
                const res = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (res.ok) {
                    log(`Upload successful: ${data.filename} (v${data.version})`);
                    versionEl.textContent = data.version;
                } else {
                    log(`Error: ${data.error}`);
                }
            } catch (err) {
                log(`Upload failed: ${err}`);
            }
        });

        function log(msg) {
            const p = document.createElement('p');
            p.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logEl.appendChild(p);
            logEl.scrollTop = logEl.scrollHeight;
        }
    </script>
</body>
</html>
