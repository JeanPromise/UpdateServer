{% extends 'base.html' %}{% set page_title = 'Sign in' %}
{% block content %}<section class="auth-layout auth-single"><div class="auth-aside"><span class="section-kicker">WELCOME BACK</span><h1>Your product data,<br><span>all in one place.</span></h1><p>Manage access, usage and API keys from your dashboard.</p></div><div class="auth-card"><h2>Sign in</h2><p class="muted">Access your developer account.</p><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email address<input type="email" name="email" autocomplete="email" required placeholder="you@example.com"></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button class="button button-full" type="submit">Sign in</button></form><p class="auth-switch">New here? <a href="{{ url_for('register') }}">Create an account</a></p></div></section>{% endblock %}
