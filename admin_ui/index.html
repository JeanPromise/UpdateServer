<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin APK Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #111; color: #fff; margin: 0; padding: 0; }
        h1 { text-align: center; margin: 20px 0; }
        #container { width: 90%; max-width: 800px; margin: 0 auto; }
        #apk-info { background: #222; padding: 20px; border-radius: 10px; margin-bottom: 20px; text-align: center; }
        #users { background: #222; padding: 20px; border-radius: 10px; max-height: 300px; overflow-y: auto; }
        input[type="file"] { margin-top: 10px; }
        button { background: #ff9800; border: none; color: #111; padding: 10px 20px; margin-left: 10px; border-radius: 5px; cursor: pointer; }
        button:hover { background: #ffc107; }
        ul { list-style: none; padding-left: 0; }
        li { padding: 5px 0; border-bottom: 1px solid #444; }
        .connected { color: #4caf50; }
    </style>
</head>
<body>
    <h1>Admin APK Dashboard</h1>
    <div id="container">
        <div id="apk-info">
            <h2>Current Version: <span id="current-version">0</span></h2>
            <form id="upload-form">
                <input type="file" id="apk-file" accept=".apk">
                <button type="submit">Upload APK</button>
            </form>
        </div>
        <div id="users">
            <h3>Connected Devices</h3>
            <ul id="user-list"></ul>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io();

        const currentVersionEl = document.getElementById("current-version");
        const userListEl = document.getElementById("user-list");
        const uploadForm = document.getElementById("upload-form");
        const apkFileInput = document.getElementById("apk-file");

        // --- WebSocket updates ---
        socket.on("apk_update", data => {
            currentVersionEl.textContent = data.version;
            console.log("APK Version updated:", data);
        });

        socket.on("users_update", users => {
            userListEl.innerHTML = "";
            users.forEach(u => {
                const li = document.createElement("li");
                li.textContent = `Device: ${u.device_id} | Version: ${u.version} | Connected: ${new Date(u.connected_at).toLocaleString()}`;
                li.className = "connected";
                userListEl.appendChild(li);
            });
            console.log("Users updated:", users);
        });

        // --- Upload APK ---
        uploadForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const file = apkFileInput.files[0];
            if (!file) return alert("Select an APK to upload");
            const formData = new FormData();
            formData.append("apk", file);

            const res = await fetch("/upload_apk", {
                method: "POST",
                body: formData
            });
            const data = await res.json();
            console.log("Upload response:", data);
            apkFileInput.value = "";
        });

        // --- Initial fetch for users ---
        fetch("/users").then(r => r.json()).then(users => {
            socket.emit("users_update", users);
        });
    </script>
</body>
</html>
