<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Admin Panel</title>
    <style>
        body { font-family: Arial; background:#111; color:#fff; padding:20px; }
        h1 { color:#ff0; }
        #users { margin-top:20px; }
        input, button { padding:8px; margin:5px; }
    </style>
</head>
<body>
    <h1>Admin Panel</h1>
    <form id="uploadForm" enctype="multipart/form-data">
        <input type="file" name="apk" accept=".apk">
        <button type="submit">Upload APK</button>
    </form>
    <div id="users">
        <h3>Online Users:</h3>
        <ul id="userList"></ul>
    </div>

    <script>
        const ws = new WebSocket(`ws://${window.location.host.replace('http://','')}/ws`);
        ws.onmessage = (e) => {
            if(e.data.startsWith("users:")) {
                const users = e.data.replace("users:","").split(",");
                const ul = document.getElementById("userList");
                ul.innerHTML = "";
                users.forEach(u=>{
                    if(u) {
                        const li = document.createElement("li");
                        li.textContent = u;
                        ul.appendChild(li);
                    }
                });
            }
        }

        document.getElementById("uploadForm").onsubmit = async function(e){
            e.preventDefault();
            const formData = new FormData(this);
            const res = await fetch('/upload_apk', {method:'POST', body:formData});
            const data = await res.json();
            alert(data.msg);
        }
    </script>
</body>
</html>
