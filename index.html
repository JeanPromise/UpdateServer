
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login & Registration</title>
<style>
  * {margin:0; padding:0; box-sizing:border-box;}
  body {
    font-family: 'Arial', sans-serif;
    background: radial-gradient(circle at top, #0d0d0d, #121212);
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    position:relative;
  }

  /* ===== Floating particles ===== */
  .particle {
    position:absolute;
    border-radius:50%;
    background: rgba(0, 255, 200, 0.6);
    animation: float 6s linear infinite;
    pointer-events:none;
  }
  @keyframes float {
    0% {transform: translateY(100vh) scale(0.5); opacity:0;}
    50% {opacity:1;}
    100% {transform: translateY(-50vh) scale(1); opacity:0;}
  }

  .container {
    background:linear-gradient(145deg, #1b1b1b, #262626);
    padding:40px;
    border-radius:15px;
    width:90%;
    max-width:380px;
    box-shadow:0 0 40px rgba(0,255,200,0.4), 0 0 20px rgba(0,0,0,0.7);
    position:relative;
    transition: transform 0.6s ease, opacity 0.6s ease;
    overflow:hidden;
  }

  h2 {
    text-align:center;
    margin-bottom:20px;
    color: #00ffc2;
    font-size:28px;
    text-shadow: 0 0 10px #00ffc2, 0 0 20px #00ffc2, 0 0 30px #00ffc2;
    animation: glowText 2s infinite alternate;
  }

  @keyframes glowText {
    0% {text-shadow: 0 0 5px #00ffc2, 0 0 10px #00ffc2, 0 0 15px #00ffc2;}
    100% {text-shadow: 0 0 15px #00ffc2, 0 0 25px #00ffc2, 0 0 35px #00ffc2;}
  }

  form {display:flex; flex-direction:column;}
  input {
    margin-bottom:15px;
    padding:12px 15px;
    border:none;
    border-radius:8px;
    font-size:16px;
    background: rgba(0,255,200,0.05);
    color:#fff;
    transition: all 0.3s ease;
  }
  input:focus {
    outline:none;
    box-shadow:0 0 8px #00ffc2;
    border:1px solid #00ffc2;
    background: rgba(0,255,200,0.1);
  }

  button {
    padding:12px;
    border:none;
    border-radius:8px;
    background: linear-gradient(90deg,#00ffc2,#00a8ff);
    color:#000;
    font-weight:bold;
    cursor:pointer;
    font-size:16px;
    transition: 0.3s;
    box-shadow:0 0 10px rgba(0,255,200,0.5);
  }
  button:hover {
    background: linear-gradient(90deg,#00a8ff,#00ffc2);
    box-shadow:0 0 20px rgba(0,255,200,0.7);
  }

  .toggle {
    text-align:center;
    margin-top:15px;
    cursor:pointer;
    color:#aaa;
    transition:0.3s;
  }
  .toggle:hover {color:#00ffc2;}

  .explode {animation: explode 0.6s forwards;}
  @keyframes explode {
    0% {transform: scale(1) rotate(0deg); opacity:1;}
    50% {transform: scale(0.6) rotate(10deg); opacity:0.8;}
    100% {transform: scale(0) rotate(30deg); opacity:0;}
  }

  .disabled-overlay {
    position:absolute;
    top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0.9);
    display:flex; justify-content:center; align-items:center;
    flex-direction:column;
    text-align:center; color:#ff5555; font-size:18px;
    z-index:10;
    border-radius:10px;
  }
  .disabled-overlay button {
    margin-top:15px;
    background:#4CAF50;
    cursor:pointer;
    padding:8px 16px;
    border:none;
    border-radius:5px;
    font-weight:bold;
  }

  .apk-version-stamp {
    position:fixed;
    bottom:10px;
    right:10px;
    color:#4CAF50;
    font-size:14px;
    font-weight:bold;
    background:rgba(0,0,0,0.4);
    padding:4px 8px;
    border-radius:5px;
    text-shadow:0 0 4px #4CAF50;
  }
</style>
</head>
<body>

<!-- Floating particles -->
<script>
for(let i=0;i<40;i++){
  const p = document.createElement('div');
  p.className='particle';
  const size=Math.random()*6+2;
  p.style.width=size+'px';
  p.style.height=size+'px';
  p.style.left=Math.random()*100+'vw';
  p.style.animationDuration=(Math.random()*5+5)+'s';
  document.body.appendChild(p);
}
</script>

<div class="container" id="container">
  <h2 id="form-title">Login</h2>
  
  <form id="login-form">
    <input type="email" placeholder="Email" required>
    <input type="password" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>

  <form id="register-form" style="display:none;">
    <input type="text" placeholder="Full Name" required>
    <input type="email" placeholder="Email" required>
    <input type="password" placeholder="Password" required>
    <input type="password" placeholder="Confirm Password" required>
    <button type="submit">Register</button>
  </form>

  <div class="toggle" id="toggle-form">Don't have an account? Register</div>
</div>

<div class="apk-version-stamp" id="apk-version-stamp">App version: 0.0.0</div>

<script>
const loginForm = document.getElementById('login-form');
const registerForm = document.getElementById('register-form');
const toggleForm = document.getElementById('toggle-form');
const formTitle = document.getElementById('form-title');
const container = document.getElementById('container');
const versionStamp = document.getElementById('apk-version-stamp');

// ----- Persistent APK version -----
let currentUserApkVersion = localStorage.getItem('installedApkVersion') || '0.0.0';
versionStamp.textContent = 'App version: ' + currentUserApkVersion;

// ----- Toggle forms -----
toggleForm.addEventListener('click', () => {
    if (loginForm.style.display !== 'none') {
        loginForm.style.display = 'none';
        registerForm.style.display = 'flex';
        formTitle.textContent = 'Register';
        toggleForm.textContent = 'Already have an account? Login';
    } else {
        loginForm.style.display = 'flex';
        registerForm.style.display = 'none';
        formTitle.textContent = 'Login';
        toggleForm.textContent = "Don't have an account? Register";
    }
});

// ----- Check for APK update -----
async function checkUpdate() {
    const res = await fetch('/check_update');
    const data = await res.json();
    if (data.apk_version && isVersionNewer(data.apk_version, currentUserApkVersion)) {
        const overlay = document.createElement('div');
        overlay.className = 'disabled-overlay';
        overlay.innerHTML = `
            <div>New APK version ${data.apk_version} is available.<br>
            Please download and install it to continue.</div>
            <button id="downloadBtn">Download APK</button>
        `;
        container.appendChild(overlay);

        document.getElementById('downloadBtn').addEventListener('click', () => {
            const a = document.createElement('a');
            a.href = '/download_apk';
            a.download = 'app-latest.apk';
            document.body.appendChild(a);
            a.click();
            a.remove();

            localStorage.setItem('installedApkVersion', data.apk_version);
            currentUserApkVersion = data.apk_version;
            versionStamp.textContent = 'App version: ' + currentUserApkVersion;

            overlay.remove();
        });
    }
}

// ----- Compare version strings -----
function isVersionNewer(serverVer, localVer) {
    const sv = serverVer.split('.').map(Number);
    const lv = localVer.split('.').map(Number);
    for(let i=0; i<Math.max(sv.length, lv.length); i++) {
        const s = sv[i]||0, l = lv[i]||0;
        if(s > l) return true;
        if(s < l) return false;
    }
    return false;
}

// ----- Animate container and show Proceed button -----
function animateAndDisappear() {
    container.classList.add('explode');
    container.addEventListener('animationend', () => {
        container.style.display = 'none';
        const proceedBtn = document.createElement('button');
        proceedBtn.textContent = 'Proceed to Shows';
        Object.assign(proceedBtn.style, {
            padding:'10px 20px', fontSize:'16px', background:'#E50914', color:'#fff',
            border:'none', borderRadius:'5px', cursor:'pointer', position:'fixed',
            top:'50%', left:'50%', transform:'translate(-50%, -50%)',
            boxShadow:'0 0 15px #00ffc2, 0 0 30px #00ffc2'
        });
        document.body.appendChild(proceedBtn);

        proceedBtn.addEventListener('click', () => {
            if (window.AndroidBridge && AndroidBridge.openGoojaraPage) {
                AndroidBridge.openGoojaraPage();
            } else {
                alert("Bridge not available.");
            }
        });
    }, {once:true});
}

// ----- Login submit -----
loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = loginForm[0].value.trim();
    const password = loginForm[1].value.trim();
    const res = await fetch('/login', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({email, password, apk_version: currentUserApkVersion})
    });
    const data = await res.json();
    if (data.success) animateAndDisappear();
    else alert(data.message);
});

// ----- Registration submit -----
registerForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = registerForm[0].value.trim();
    const email = registerForm[1].value.trim();
    const password = registerForm[2].value.trim();
    const confirm = registerForm[3].value.trim();
    if (password !== confirm) return alert('Passwords do not match!');

    const res = await fetch('/register', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({name,email,password})
    });
    const data = await res.json();
    if (data.success) {
        alert('Registration successful! Please log in.');
        registerForm.style.display = 'none';
        loginForm.style.display = 'flex';
        formTitle.textContent = 'Login';
        toggleForm.textContent = "Don't have an account? Register";
    } else alert(data.message);
});

// ----- Initial APK update check -----
checkUpdate();
</script>
</body>
</html>
