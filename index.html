<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login & Registration</title>
<style>
  * {margin:0; padding:0; box-sizing:border-box;}
  body {
    font-family: Arial, sans-serif;
    background:#121212;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
  }
  .container {
    background:#1e1e1e;
    padding:40px;
    border-radius:10px;
    width:350px;
    box-shadow:0 0 20px rgba(0,0,0,0.7);
    position:relative;
    transition: transform 0.6s ease, opacity 0.6s ease;
    z-index:1;
  }
  h2 {text-align:center; margin-bottom:20px; color:#E50914;}
  form {display:flex; flex-direction:column;}
  input {
    margin-bottom:15px;
    padding:10px;
    border:none;
    border-radius:5px;
    font-size:16px;
  }
  input:focus {outline:none; border:2px solid #E50914;}
  button {
    padding:10px;
    border:none;
    border-radius:5px;
    background:#E50914;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
  }
  button:hover {background:#ff1a2c;}
  .toggle {text-align:center; margin-top:10px; cursor:pointer; color:#aaa;}
  .toggle:hover {color:#fff;}
  .explode {animation: explode 0.6s forwards;}
  @keyframes explode {
    0% {transform: scale(1) rotate(0deg); opacity:1;}
    50% {transform: scale(0.6) rotate(10deg); opacity:0.8;}
    100% {transform: scale(0) rotate(30deg); opacity:0;}
  }
  .disabled-overlay {
    position:absolute;
    top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0.85);
    display:flex; justify-content:center; align-items:center;
    flex-direction:column;
    text-align:center; color:#ff5555; font-size:18px;
    z-index:10;
    border-radius:10px;
  }
  .disabled-overlay button {
    margin-top:15px;
    background:#4CAF50;
    cursor:pointer;
  }
</style>
</head>
<body>

<div class="container" id="container">
  <h2 id="form-title">Login</h2>
  
  <form id="login-form">
    <input type="email" placeholder="Email" required>
    <input type="password" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>

  <form id="register-form" style="display:none;">
    <input type="text" placeholder="Full Name" required>
    <input type="email" placeholder="Email" required>
    <input type="password" placeholder="Password" required>
    <input type="password" placeholder="Confirm Password" required>
    <button type="submit">Register</button>
  </form>

  <div class="toggle" id="toggle-form">Don't have an account? Register</div>
</div>

<script>
const loginForm = document.getElementById('login-form');
const registerForm = document.getElementById('register-form');
const toggleForm = document.getElementById('toggle-form');
const formTitle = document.getElementById('form-title');
const container = document.getElementById('container');

// Track user's APK version in localStorage
let currentUserApkVersion = localStorage.getItem('apk_version') || '0.0.0';

// ----- Toggle forms -----
toggleForm.addEventListener('click', () => {
    if (loginForm.style.display !== 'none') {
        loginForm.style.display = 'none';
        registerForm.style.display = 'flex';
        formTitle.textContent = 'Register';
        toggleForm.textContent = 'Already have an account? Login';
    } else {
        loginForm.style.display = 'flex';
        registerForm.style.display = 'none';
        formTitle.textContent = 'Login';
        toggleForm.textContent = "Don't have an account? Register";
    }
});

// ----- APK overlay -----
async function checkUpdate() {
    try {
        const res = await fetch('/check_update');
        const data = await res.json();
        if (data.apk_version) {
            if (data.apk_version !== currentUserApkVersion) {
                showApkOverlay(data.apk_version, data.url);
            }
        }
    } catch (err) {
        console.error("Update check failed:", err);
    }
}

function showApkOverlay(version, url) {
    const overlay = document.createElement('div');
    overlay.className = 'disabled-overlay';
    overlay.innerHTML = `
        <div>New APK version ${version} is available.<br>
        Please download and install it to continue.</div>
        <button id="downloadBtn">Download APK</button>
    `;
    container.appendChild(overlay);

    document.getElementById('downloadBtn').addEventListener('click', () => {
        const a = document.createElement('a');
        a.href = url;
        a.download = 'app-latest.apk';
        document.body.appendChild(a);
        a.click();
        a.remove();

        // Save updated version to localStorage
        localStorage.setItem('apk_version', version);
        overlay.remove();
    });
}

// ----- Animate container and show Proceed button -----
function animateAndDisappear() {
    container.classList.add('explode');
    container.addEventListener('animationend', () => {
        container.style.display = 'none';

        const proceedBtn = document.createElement('button');
        proceedBtn.textContent = 'Proceed to Shows';
        proceedBtn.style.cssText = `
            padding:10px 20px; font-size:16px; background:#E50914; color:#fff;
            border:none; border-radius:5px; cursor:pointer;
            position:fixed; top:50%; left:50%; transform:translate(-50%, -50%);
        `;
        document.body.appendChild(proceedBtn);

        proceedBtn.addEventListener('click', () => {
            if (window.AndroidBridge && AndroidBridge.openGoojaraPage) {
                AndroidBridge.openGoojaraPage();
            } else {
                alert("Bridge not available.");
            }
        });
    }, {once:true});
}

// ----- Login submit -----
loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = loginForm[0].value.trim();
    const password = loginForm[1].value.trim();
    const res = await fetch('/login', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({email, password, apk_version: currentUserApkVersion})
    });
    const data = await res.json();
    if (data.success) {
        animateAndDisappear();
    } else {
        alert(data.message);
    }
});

// ----- Registration submit -----
registerForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = registerForm[0].value.trim();
    const email = registerForm[1].value.trim();
    const password = registerForm[2].value.trim();
    const confirm = registerForm[3].value.trim();
    if (password !== confirm) return alert('Passwords do not match!');

    const res = await fetch('/register', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({name,email,password})
    });
    const data = await res.json();

    if (data.success) {
        alert('Registration successful! Please log in.');
        registerForm.style.display = 'none';
        loginForm.style.display = 'flex';
        formTitle.textContent = 'Login';
        toggleForm.textContent = "Don't have an account? Register";
    } else {
        alert(data.message);
    }
});

// ----- Initial APK update check -----
checkUpdate();
</script>

</body>
</html>
