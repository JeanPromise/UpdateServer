<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Upload APK</title>
<style>
  * {margin:0; padding:0; box-sizing:border-box;}
  body {
    font-family: Arial, sans-serif;
    background:#121212;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
  }
  .container {
    background:#1e1e1e;
    padding:40px;
    border-radius:10px;
    width:400px;
    box-shadow: 0 0 20px rgba(0,0,0,0.7);
  }
  h2 {text-align:center; margin-bottom:20px; color:#E50914;}
  input, button {
    margin-bottom:15px;
    padding:10px;
    border-radius:5px;
    font-size:16px;
  }
  input, button {border:none;}
  input[type="file"] {color:#fff;}
  button {
    background:#E50914;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
  }
  button:hover {background:#ff1a2c;}
  .status {margin-top:15px; text-align:center;}
</style>
</head>
<body>

<div class="container">
  <h2>Admin - Upload APK</h2>
  <form id="apk-form">
    <input type="file" id="apk-file" accept=".apk" required>
    <input type="text" id="apk-version" placeholder="APK Version (e.g., 1.0.0)" required>
    <button type="submit">Upload APK</button>
  </form>
  <div class="status" id="status"></div>
</div>

<script>
const form = document.getElementById('apk-form');
const fileInput = document.getElementById('apk-file');
const versionInput = document.getElementById('apk-version');
const statusDiv = document.getElementById('status');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const file = fileInput.files[0];
  const version = versionInput.value.trim();
  if (!file || !version) return;

  const formData = new FormData();
  formData.append('apk', file);
  formData.append('version', version);

  statusDiv.textContent = 'Uploading...';

  try {
    const res = await fetch('/admin/upload', {
      method: 'POST',
      body: formData
    });
    const data = await res.json();
    if (data.success) {
      statusDiv.textContent = `APK uploaded successfully! Version: ${version}`;
    } else {
      statusDiv.textContent = `Error: ${data.error}`;
    }
  } catch (err) {
    console.error(err);
    statusDiv.textContent = 'Upload failed';
  }
});
</script>

</body>
</html>
