<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login & Registration</title>
<style>
  * {margin:0; padding:0; box-sizing:border-box;}
  body {
    font-family: 'Arial', sans-serif;
    background:#000000; /* pure black */
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    flex-direction:column;
    position:relative;
  }

  /* ================= TomorrowLand Title ================= */
  #title {
    font-family: 'Arial Narrow', sans-serif;
    font-weight: bold;
    font-size: 10vw; /* scales with screen width */
    text-align: center;
    margin-bottom: 30px;
    position: relative;
    background: linear-gradient(90deg, #80dfff, #ffffff, #80dfff, #ffffff);
    background-size: 400% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 4s linear infinite;
    z-index:1;
  }
  @keyframes shimmer {
    0% {background-position: 0% 0%;}
    50% {background-position: 100% 0%;}
    100% {background-position: 0% 0%;}
  }

  /* Sparkle container */
  #sparkle-container {
    position:absolute;
    top:calc(50% - 7vw);
    left:50%;
    transform:translateX(-50%);
    width:100%;
    height:15vw;
    pointer-events:none;
    z-index:2;
  }

  .sparkle {
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    opacity:0;
  }

  /* Login/Register container */
  .container {
    background:#000000;
    padding:30px;
    border-radius:12px;
    width:90%;
    max-width:380px;
    display:flex;
    flex-direction:column;
    box-shadow:0 0 20px rgba(0,0,0,0.8);
    position:relative;
    z-index:3;
  }

  h2 {
    text-align:center;
    margin-bottom:20px;
    color:#80dfff;
    font-size:1.5rem;
  }

  form {
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  input {
    padding:12px;
    border:1px solid #80dfff;
    border-radius:8px;
    font-size:1rem;
    background:#e0f7fa;
    color:#000;
  }

  input:focus {outline:none; border:2px solid #a0f0ff;}

  button {
    padding:12px;
    border-radius:8px;
    border:1px solid #80dfff;
    background:#000;
    color:#80dfff;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
  }

  button:hover {background:#101010; color:#a0f0ff;}

  .toggle {
    text-align:center;
    margin-top:12px;
    cursor:pointer;
    color:#80dfff;
  }

  .toggle:hover {color:#a0f0ff;}

  .apk-version-stamp {
    position:fixed;
    bottom:10px;
    right:10px;
    color:#00ff00; /* luminous green */
    font-size:14px;
    font-weight:bold;
    background:rgba(0,0,0,0.4);
    padding:4px 8px;
    border-radius:5px;
    z-index:5;
  }

  .disabled-overlay {
    position:absolute;
    top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0.9);
    display:flex; justify-content:center; align-items:center;
    flex-direction:column;
    text-align:center; color:#ff5555; font-size:18px;
    z-index:10;
    border-radius:12px;
  }

  .disabled-overlay button {
    margin-top:15px;
    background:#80dfff;
    color:#000;
    cursor:pointer;
    padding:10px 16px;
    border:none;
    border-radius:8px;
    font-weight:bold;
  }

  .proceed-btn {
    padding:12px 20px;
    font-size:16px;
    background:#80dfff;
    color:#000;
    border:none;
    border-radius:8px;
    cursor:pointer;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    display:none;
    z-index:100;
  }
</style>
</head>
<body>

<div id="title">TOMORROWLAND</div>
<div id="sparkle-container"></div>

<div class="container" id="container">
  <h2 id="form-title">Login</h2>
  
  <form id="login-form">
    <input type="email" placeholder="Email" required>
    <input type="password" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>

  <form id="register-form" style="display:none;">
    <input type="text" placeholder="Full Name" required>
    <input type="email" placeholder="Email" required>
    <input type="password" placeholder="Password" required>
    <input type="password" placeholder="Confirm Password" required>
    <button type="submit">Register</button>
  </form>

  <div class="toggle" id="toggle-form">Don't have an account? Register</div>
</div>

<button class="proceed-btn" id="proceedBtn">Proceed to Shows</button>
<div class="apk-version-stamp" id="apk-version-stamp">App version: 0.0.0</div>

<script>
const loginForm = document.getElementById('login-form');
const registerForm = document.getElementById('register-form');
const toggleForm = document.getElementById('toggle-form');
const container = document.getElementById('container');
const proceedBtn = document.getElementById('proceedBtn');

// Toggle forms
toggleForm.addEventListener('click', () => {
    if (loginForm.style.display !== 'none') {
        loginForm.style.display = 'none';
        registerForm.style.display = 'flex';
        document.getElementById('form-title').textContent = 'Register';
        toggleForm.textContent = 'Already have an account? Login';
    } else {
        loginForm.style.display = 'flex';
        registerForm.style.display = 'none';
        document.getElementById('form-title').textContent = 'Login';
        toggleForm.textContent = "Don't have an account? Register";
    }
});

// Animate container disappearance
function animateAndProceed() {
    container.style.display='none';
    proceedBtn.style.display='block';
}

proceedBtn.addEventListener('click', () => {
    if (window.AndroidBridge && AndroidBridge.openGoojaraPage) {
        AndroidBridge.openGoojaraPage();
    } else { alert("Bridge not available."); }
});

// Simulate login/register success
loginForm.addEventListener('submit', e => { e.preventDefault(); animateAndProceed(); });
registerForm.addEventListener('submit', e => { e.preventDefault(); animateAndProceed(); });

// ================= Stardust particle effect =================
const sparkleContainer = document.getElementById('sparkle-container');
const title = document.getElementById('title');

function createStardust() {
    const sparkle = document.createElement('div');
    sparkle.className = 'sparkle';

    // follow shimmer along text width
    const rect = title.getBoundingClientRect();
    const offsetX = rect.left + Math.random() * rect.width;
    const offsetY = rect.top + Math.random() * rect.height;

    sparkle.style.left = offsetX + 'px';
    sparkle.style.top = offsetY + 'px';

    sparkleContainer.appendChild(sparkle);

    const duration = 800 + Math.random()*400;

    sparkle.animate([
        {opacity:0, transform:'scale(0.3) translateY(0px)'},
        {opacity:1, transform:'scale(1.2) translateY(-3px)'},
        {opacity:0, transform:'scale(0.3) translateY(0px)'}
    ], {duration: duration, iterations:1, easing:'ease-out'});

    setTimeout(()=>{ sparkle.remove(); }, duration);
}

// Continuously spawn stardust particles
setInterval(createStardust, 120);
</script>

</body>
</html>
