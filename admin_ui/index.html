<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<style>
    body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 0;}
    header { background: #1f1f1f; padding: 20px; text-align: center; font-size: 1.5em; }
    main { padding: 20px; }
    .section { margin-bottom: 30px; }
    button { padding: 10px 20px; background: #ff9800; border: none; cursor: pointer; color: #000; font-weight: bold; }
    input[type="file"] { padding: 5px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #333; }
    th { background: #1f1f1f; }
    tr:hover { background: #333; }
    .status { font-weight: bold; }
</style>
</head>
<body>

<header>Admin Dashboard</header>
<main>

<div class="section">
    <h2>Upload APK</h2>
    <form id="apkForm">
        <input type="file" id="apkFile" name="apk" accept=".apk">
        <button type="submit">Upload</button>
    </form>
    <p>Current APK Version: <span id="apkVersion">0</span></p>
    <p>Filename: <span id="apkFilename">None</span></p>
</div>

<div class="section">
    <h2>Live Users</h2>
    <table id="usersTable">
        <thead>
            <tr>
                <th>Device ID</th>
                <th>Version</th>
                <th>Connected At (UTC)</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<div class="section">
    <h2>Live Console</h2>
    <div id="console" style="background:#000; padding:10px; height:200px; overflow-y:auto;"></div>
</div>

</main>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
const socket = io();

// Elements
const apkVersionEl = document.getElementById("apkVersion");
const apkFilenameEl = document.getElementById("apkFilename");
const usersTableBody = document.querySelector("#usersTable tbody");
const consoleEl = document.getElementById("console");

// --- Helpers ---
function logMessage(msg) {
    const p = document.createElement("p");
    p.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    consoleEl.appendChild(p);
    consoleEl.scrollTop = consoleEl.scrollHeight;
}

function renderUsers(users) {
    usersTableBody.innerHTML = "";
    users.forEach(u => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${u.device_id}</td><td>${u.version}</td><td>${u.connected_at}</td>`;
        usersTableBody.appendChild(tr);
    });
}

// --- Socket Events ---
socket.on("connect", () => logMessage("Connected to server"));
socket.on("disconnect", () => logMessage("Disconnected from server"));

socket.on("apk_update", data => {
    apkVersionEl.textContent = data.version;
    apkFilenameEl.textContent = data.filename;
    logMessage(`APK Updated: v${data.version} (${data.filename})`);
});

socket.on("users_update", users => {
    renderUsers(users);
    logMessage(`Users list updated (${users.length} devices)`);
});

socket.on("user_connected", user => {
    renderUsers([...usersTableBody.querySelectorAll("tr")].map(r => ({
        device_id: r.cells[0].textContent,
        version: r.cells[1].textContent,
        connected_at: r.cells[2].textContent
    })).concat(user));
    logMessage(`Device connected: ${user.device_id}`);
});

// --- APK Upload ---
document.getElementById("apkForm").addEventListener("submit", async e => {
    e.preventDefault();
    const fileInput = document.getElementById("apkFile");
    if (!fileInput.files.length) return alert("Select an APK file first");
    const formData = new FormData();
    formData.append("apk", fileInput.files[0]);
    const res = await fetch("/upload_apk", { method: "POST", body: formData });
    if (res.ok) {
        const data = await res.json();
        logMessage(`APK uploaded: v${data.version} (${data.filename})`);
    } else {
        logMessage("APK upload failed");
    }
});
</script>

</body>
</html>
