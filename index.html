<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login & Registration</title>
<style>
  * {margin:0; padding:0; box-sizing:border-box;}
  body {
    font-family: 'Arial', sans-serif;
    background:#000000; /* pure black */
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    flex-direction:column;
  }

  /* ================= TomorrowLand animated title ================= */
  #title {
    font-family: 'Arial Black', sans-serif;
    font-size: 48px;
    font-weight: bold;
    color: #80dfff; /* icy sky blue */
    text-align: center;
    margin-bottom: 40px;
    position: relative;
    animation: shimmer 3s infinite linear;
  }
  @keyframes shimmer {
    0% {text-shadow: 0 0 5px #80dfff, 0 0 10px #80dfff;}
    50% {text-shadow: 0 0 15px #a0f0ff, 0 0 25px #80dfff;}
    100% {text-shadow: 0 0 5px #80dfff, 0 0 10px #80dfff;}
  }

  .container {
    background:#000000; /* black background */
    padding:40px;
    border-radius:12px;
    width:360px;
    display:flex;
    flex-direction:column;
    box-shadow:0 0 20px rgba(0,0,0,0.8);
    position:relative;
  }

  h2 {
    text-align:center;
    margin-bottom:20px;
    color:#80dfff; /* sky blue headings */
    font-size:24px;
  }

  form {
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  input {
    padding:12px;
    border:1px solid #80dfff; /* thin sky blue border */
    border-radius:8px; /* smooth corners */
    font-size:16px;
    background:#e0f7fa; /* whitish sky blue */
    color:#000000; /* black typed text */
  }

  input:focus {
    outline:none;
    border:2px solid #a0f0ff; /* highlight on focus */
  }

  button {
    padding:12px;
    border-radius:8px;
    border:1px solid #80dfff;
    background:#000000;
    color:#80dfff;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
  }

  button:hover {
    background:#101010;
    color:#a0f0ff;
  }

  .toggle {
    text-align:center;
    margin-top:12px;
    cursor:pointer;
    color:#80dfff;
  }

  .toggle:hover {color:#a0f0ff;}

  .apk-version-stamp {
    position:fixed;
    bottom:10px;
    right:10px;
    color:#80dfff;
    font-size:14px;
    font-weight:bold;
    background:rgba(0,0,0,0.4);
    padding:4px 8px;
    border-radius:5px;
  }

  .disabled-overlay {
    position:absolute;
    top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0.9);
    display:flex; justify-content:center; align-items:center;
    flex-direction:column;
    text-align:center; color:#ff5555; font-size:18px;
    z-index:10;
    border-radius:12px;
  }

  .disabled-overlay button {
    margin-top:15px;
    background:#80dfff;
    color:#000;
    cursor:pointer;
    padding:10px 16px;
    border:none;
    border-radius:8px;
    font-weight:bold;
  }

  .proceed-btn {
    padding:12px 20px;
    font-size:16px;
    background:#80dfff;
    color:#000;
    border:none;
    border-radius:8px;
    cursor:pointer;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    display:none;
    z-index:100;
  }

</style>
</head>
<body>

<div id="title">TOMORROWLAND</div>

<div class="container" id="container">
  <h2 id="form-title">Login</h2>
  
  <form id="login-form">
    <input type="email" placeholder="Email" required>
    <input type="password" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>

  <form id="register-form" style="display:none;">
    <input type="text" placeholder="Full Name" required>
    <input type="email" placeholder="Email" required>
    <input type="password" placeholder="Password" required>
    <input type="password" placeholder="Confirm Password" required>
    <button type="submit">Register</button>
  </form>

  <div class="toggle" id="toggle-form">Don't have an account? Register</div>
</div>

<button class="proceed-btn" id="proceedBtn">Proceed to Shows</button>

<div class="apk-version-stamp" id="apk-version-stamp">App version: 0.0.0</div>

<script>
const loginForm = document.getElementById('login-form');
const registerForm = document.getElementById('register-form');
const toggleForm = document.getElementById('toggle-form');
const formTitle = document.getElementById('form-title');
const container = document.getElementById('container');
const versionStamp = document.getElementById('apk-version-stamp');
const proceedBtn = document.getElementById('proceedBtn');

let currentUserApkVersion = localStorage.getItem('installedApkVersion') || '0.0.0';
versionStamp.textContent = 'App version: ' + currentUserApkVersion;

// ----- Toggle forms -----
toggleForm.addEventListener('click', () => {
    if (loginForm.style.display !== 'none') {
        loginForm.style.display = 'none';
        registerForm.style.display = 'flex';
        formTitle.textContent = 'Register';
        toggleForm.textContent = 'Already have an account? Login';
    } else {
        loginForm.style.display = 'flex';
        registerForm.style.display = 'none';
        formTitle.textContent = 'Login';
        toggleForm.textContent = "Don't have an account? Register";
    }
});

// ----- Animate container and show Proceed button -----
function animateAndProceed() {
    container.style.display='none';
    proceedBtn.style.display='block';
}

proceedBtn.addEventListener('click', () => {
    if (window.AndroidBridge && AndroidBridge.openGoojaraPage) {
        AndroidBridge.openGoojaraPage();
    } else {
        alert("Bridge not available.");
    }
});

// ----- Login submit -----
loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    // simulate server login success
    animateAndProceed();
});

// ----- Registration submit -----
registerForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    // simulate server registration success
    animateAndProceed();
});

</script>
</body>
</html>
