<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<style>
body { font-family: Arial, sans-serif; background:#121212; color:#fff; padding:20px; margin:0;}
h1, h2 { color:#E50914; }
table { width:100%; border-collapse:collapse; margin-top:20px; }
th, td { padding:10px; border:1px solid #333; text-align:left; }
th { background:#1e1e1e; }
tr:nth-child(even) { background:#1a1a1a; }
button { padding:5px 10px; border:none; border-radius:5px; cursor:pointer; font-weight:bold; margin:2px; }
.enable { background:#4CAF50; color:#fff; }
.disable { background:#f44336; color:#fff; }
.all-btn { margin:10px 5px; padding:10px 20px; }
input[type="file"], input[type="text"] { margin:5px 0; padding:5px; }
#delete-apk { background:#FF4500; color:#fff; display:none; margin-left:10px; }

/* ===== Contact Us/Admin messages ===== */
#contact-section { display:flex; margin-top:30px; gap:20px; height:400px; }
#user-list { width:200px; background:#1e1e1e; border-radius:10px; overflow-y:auto; }
.user-item { padding:10px; border-bottom:1px solid #333; cursor:pointer; }
.user-item.selected { background:#333; }
#conversation { flex:1; display:flex; flex-direction:column; background:#1e1e1e; border-radius:10px; padding:10px; }
#messages { flex:1; overflow-y:auto; margin-bottom:10px; }
.message { padding:8px; margin-bottom:5px; border-radius:5px; }
.message.user { background:#333; text-align:right; }
.message.admin { background:#4CAF50; text-align:left; }
#reply-box { display:flex; gap:5px; }
#reply-text { flex:1; padding:5px; border-radius:5px; border:none; }
#reply-btn { padding:5px 10px; border:none; border-radius:5px; background:#E50914; color:#fff; cursor:pointer; }
#reply-btn:hover { background:#ff1a2c; }
</style>
</head>
<body>

<h1>Admin Dashboard</h1>

<h2>Upload New APK</h2>
<form id="upload-apk-form">
  <input type="file" id="apk-file" required>
  <input type="text" id="apk-version" placeholder="Version (e.g., 1.0.1)" required>
  <button type="submit">Upload APK</button>
  <button type="button" id="delete-apk">Delete APK</button>
</form>
<p id="latest-apk" style="margin-top:10px;"></p>

<h2>Users Management</h2>
<button class="all-btn enable" id="enable-all">Enable All Users</button>
<button class="all-btn disable" id="disable-all">Disable All Users</button>

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Status</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody id="users-tbody"></tbody>
</table>

<!-- ===== Contact Us / Admin Messages ===== -->
<h2>Contact Us / User Messages</h2>
<div id="contact-section">
  <div id="user-list"></div>
  <div id="conversation">
    <div id="messages"></div>
    <div id="reply-box">
      <input type="text" id="reply-text" placeholder="Type a reply...">
      <button id="reply-btn">Send</button>
    </div>
  </div>
</div>

<script>
// ---------------- Users Management ----------------
async function loadUsers() {
  const res = await fetch('/get_users');
  const users = await res.json();
  const tbody = document.getElementById('users-tbody');
  tbody.innerHTML = '';
  users.forEach(u => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${u.name}</td>
      <td>${u.email}</td>
      <td>${u.enabled ? 'Enabled' : 'Disabled'}</td>
      <td>
        <button class="${u.enabled ? 'disable' : 'enable'}" onclick="toggleUser('${u.email}', ${!u.enabled})">
          ${u.enabled ? 'Disable' : 'Enable'}
        </button>
      </td>
    `;
    tbody.appendChild(tr);
  });

  // Populate left user list for messages
  const userList = document.getElementById('user-list');
  userList.innerHTML = '';
  users.forEach(u => {
    const div = document.createElement('div');
    div.className = 'user-item';
    div.textContent = u.name + ' (' + u.email + ')';
    div.dataset.email = u.email;
    div.addEventListener('click', () => selectUser(u.email, div));
    userList.appendChild(div);
  });
}

async function toggleUser(email, enable) {
  await fetch('/toggle_user', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({email, enable})
  });
  loadUsers();
}

document.getElementById('enable-all').addEventListener('click', async () => {
  await fetch('/enable_all', {method:'POST'});
  loadUsers();
});
document.getElementById('disable-all').addEventListener('click', async () => {
  await fetch('/disable_all', {method:'POST'});
  loadUsers();
});

// ---------------- APK ----------------
async function loadLatestAPK() {
  const res = await fetch('/get_apk');
  const apk = await res.json();
  const p = document.getElementById('latest-apk');
  const delBtn = document.getElementById('delete-apk');

  if(apk.download_url) {
    p.innerHTML = `Latest APK: Version <b>${apk.version}</b> - <a href="${apk.download_url}" target="_blank">Download</a>`;
    delBtn.style.display = 'inline-block';
  } else {
    p.innerHTML = `No APK uploaded yet.`;
    delBtn.style.display = 'none';
  }
}

document.getElementById('upload-apk-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fileInput = document.getElementById('apk-file');
  const versionInput = document.getElementById('apk-version');
  const file = fileInput.files[0];
  const version = versionInput.value.trim();
  if(!file || !version) return alert('File and version required.');

  const formData = new FormData();
  formData.append('apk', file);
  formData.append('version', version);

  const res = await fetch('/upload_apk', {method:'POST', body: formData});
  const data = await res.json();
  alert(data.message);

  fileInput.value = '';
  versionInput.value = '';

  loadLatestAPK();
});

document.getElementById('delete-apk').addEventListener('click', async () => {
  if(!confirm('Are you sure you want to delete the APK?')) return;
  const res = await fetch('/delete_apk', {method:'POST'});
  const data = await res.json();
  alert(data.message);
  loadLatestAPK();
});

// ---------------- Contact Us / Messages ----------------
let selectedEmail = null;

async function loadMessages(email) {
  if(!email) return;
  const res = await fetch('/admin/get_messages');
  const data = await res.json();
  const userConvo = data.find(u => u.user_email === email);
  const messagesDiv = document.getElementById('messages');
  messagesDiv.innerHTML = '';

  if(userConvo && userConvo.messages.length){
    userConvo.messages.forEach(m => {
      const div = document.createElement('div');
      div.className = 'message ' + m.from;
      div.textContent = m.text + ' [' + new Date(m.timestamp).toLocaleTimeString() + ']';
      messagesDiv.appendChild(div);
    });
  }
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function selectUser(email, divElement) {
  selectedEmail = email;
  document.querySelectorAll('.user-item').forEach(e => e.classList.remove('selected'));
  divElement.classList.add('selected');
  loadMessages(email);
}

document.getElementById('reply-btn').addEventListener('click', async () => {
  const textInput = document.getElementById('reply-text');
  if(!selectedEmail || !textInput.value) return alert('Select user and type message');
  const res = await fetch('/admin/reply', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({email: selectedEmail, text: textInput.value})
  });
  const data = await res.json();
  if(data.success){
    textInput.value = '';
    loadMessages(selectedEmail);
  }
});

// Initial load
loadUsers();
loadLatestAPK();
</script>

</body>
</html>
