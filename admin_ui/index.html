<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Update Server</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
<h1>Update Server Admin</h1>

<form id="uploadForm" enctype="multipart/form-data">
  <input type="file" id="apkFile" name="apk" accept=".apk">
  <button type="submit">Upload APK</button>
</form>

<ul id="apkList"></ul>

<script>
const socket = io('https://updateserver-kyj7.onrender.com');

socket.on('connect', () => {
  console.log('Connected to WebSocket');
});

socket.on('status', data => {
  console.log(data.msg);
});

socket.on('new_apk', data => {
  const list = document.getElementById('apkList');
  const item = document.createElement('li');
  item.innerHTML = `<a href="/apk/${data.filename}" target="_blank">${data.filename}</a>`;
  list.appendChild(item);
});

document.getElementById('uploadForm').addEventListener('submit', async e => {
  e.preventDefault();
  const fileInput = document.getElementById('apkFile');
  const formData = new FormData();
  formData.append('apk', fileInput.files[0]);
  const res = await fetch('/upload', { method: 'POST', body: formData });
  const data = await res.json();
  if (data.success) alert('APK uploaded: ' + data.filename);
});
</script>
</body>
</html>
