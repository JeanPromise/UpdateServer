<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tomorrow Movies - Login</title>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
        background: linear-gradient(135deg, #B81D24, #E50914);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
    }

    .login-container {
        background: rgba(0,0,0,0.6);
        padding: 32px;
        border-radius: 16px;
        width: 90%;
        max-width: 400px;
        text-align: center;
    }

    input[type=text], input[type=password] {
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        border-radius: 8px;
        border: none;
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 12px;
        border: none;
        border-radius: 8px;
        background-color: #FF4444;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background-color: #E50914;
    }

    .contact {
        margin-top: 16px;
        font-size: 14px;
    }

    .contact a {
        color: #FFD700;
        text-decoration: none;
    }
</style>
</head>
<body>
    <div class="login-container">
        <h2>Login</h2>
        <input type="text" placeholder="Username" id="username">
        <input type="password" placeholder="Password" id="password">
        <button onclick="login()">Login</button>
        <div class="contact">
            Contact us: <a href="mailto:support@tomorrow.com">support@tomorrow.com</a>
        </div>
    </div>

<script>
function login() {
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    if(username && password) {
        AndroidBridge.registrationSuccess("Login simulated!");
    } else {
        alert("Please enter credentials.");
    }
}
</script>
</body>
</html>
