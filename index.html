<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Login & Registration</title>
<style>
/* Your original styling preserved and kept concise */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial, sans-serif;background:radial-gradient(circle at top,#0d0d0d,#121212);color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden;position:relative}
.particle{position:absolute;border-radius:50%;background:rgba(0,255,200,0.6);animation:float 6s linear infinite;pointer-events:none}
@keyframes float{0%{transform:translateY(100vh) scale(.5);opacity:0}50%{opacity:1}100%{transform:translateY(-50vh) scale(1);opacity:0}}
.container{background:linear-gradient(145deg,#1b1b1b,#262626);padding:36px;border-radius:15px;width:92%;max-width:420px;box-shadow:0 0 40px rgba(0,255,200,.35);position:relative;overflow:hidden}
h2{color:#00ffc2;text-align:center;margin-bottom:18px;font-size:26px;text-shadow:0 0 10px #00ffc2}
.form-row{display:flex;flex-direction:column;gap:10px}
input{padding:12px;border-radius:8px;border:none;background:rgba(0,255,200,0.05);color:#fff;font-size:15px}
input:focus{outline:none;box-shadow:0 0 8px #00ffc2;border:1px solid #00ffc2;background:rgba(0,255,200,0.08)}
button{padding:12px;border-radius:8px;border:none;background:linear-gradient(90deg,#00ffc2,#00a8ff);color:#000;font-weight:700;cursor:pointer}
.toggle{margin-top:12px;text-align:center;color:#aaa;cursor:pointer}
.toggle:hover{color:#00ffc2}
.apk-version-stamp{position:fixed;right:12px;bottom:12px;background:rgba(0,0,0,.4);padding:6px 8px;border-radius:6px;color:#4CAF50;font-weight:700}

/* Download panel (MANDATORY, sits above forms) */
#download-panel{background:rgba(0,0,0,0.35);padding:12px;border-radius:10px;margin-bottom:14px;text-align:center}
#download-panel .msg{margin-bottom:8px;font-weight:700}

/* Full-screen overlays (non-dismissible) */
.overlay-full{position:fixed;inset:0;background:rgba(0,0,0,0.88);display:flex;align-items:center;justify-content:center;z-index:9999}
.overlay-card{background:linear-gradient(145deg,#0d0d0d,#121212);padding:18px;border-radius:12px;text-align:center;width:92%;max-width:420px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}100%{opacity:1}}
.small{color:#ccc;font-size:14px;margin-top:8px}
</style>
</head>
<body>
<!-- particles -->
<script>for(let i=0;i<36;i++){const p=document.createElement('div');p.className='particle';const s=Math.random()*6+2;p.style.width=s+'px';p.style.height=s+'px';p.style.left=Math.random()*100+'vw';p.style.animationDuration=(Math.random()*5+5)+'s';document.body.appendChild(p);}</script>

<div class="container" id="container">
  <h2 id="form-title">Login</h2>

  <!-- MANDATORY Download panel ON TOP of forms -->
  <div id="download-panel">
    <div class="msg">Download required — you must install the APK</div>
    <div>
      <button id="downloadBtn">Download APK</button>
    </div>
    <div class="small">Click Download APK — then wait. After 55s you'll be prompted to Install.</div>
  </div>

  <!-- Login form (disabled until installed) -->
  <form id="login-form" class="form-row">
    <input id="login-email" type="email" placeholder="Email" required disabled>
    <input id="login-pass" type="password" placeholder="Password" required disabled>
    <button id="login-submit" type="submit" disabled>Login</button>
  </form>

  <!-- Register (hidden by default) -->
  <form id="register-form" class="form-row" style="display:none;margin-top:8px">
    <input id="reg-name" type="text" placeholder="Full Name" required disabled>
    <input id="reg-email" type="email" placeholder="Email" required disabled>
    <input id="reg-pass" type="password" placeholder="Password" required disabled>
    <input id="reg-confirm" type="password" placeholder="Confirm Password" required disabled>
    <button id="reg-submit" type="submit" disabled>Register</button>
  </form>

  <div class="toggle" id="toggle-form">Don't have an account? Register</div>
</div>

<div class="apk-version-stamp" id="apk-version-stamp">App version: 0.0.0</div>

<script>
/* EXACT keys and styles you asked for */
const COUNTDOWN_END_KEY = 'apk_countdown_end';
const COUNTDOWN_VERSION_KEY = 'apk_pending_version';

const downloadBtn = document.getElementById('downloadBtn');
const downloadPanel = document.getElementById('download-panel');
const versionStamp = document.getElementById('apk-version-stamp');
const loginForm = document.getElementById('login-form');
const registerForm = document.getElementById('register-form');
const toggleForm = document.getElementById('toggle-form');

let currentUserApkVersion = localStorage.getItem('installedApkVersion') || '0.0.0';
versionStamp.textContent = 'App version: ' + currentUserApkVersion;

/* disable/enable helpers */
function disableAllForms(){
  document.querySelectorAll('input, button').forEach(el=>{
    // keep download button enabled
    if(el.id === 'downloadBtn') { el.disabled = false; return; }
    el.disabled = true;
  });
}
function enableAllForms(){
  document.querySelectorAll('input, button').forEach(el=>{
    el.disabled = false;
  });
}

/* toggle form view */
toggleForm.addEventListener('click', ()=>{
  if(loginForm.style.display !== 'none'){
    loginForm.style.display = 'none';
    registerForm.style.display = 'flex';
    toggleForm.textContent = 'Already have an account? Login';
  } else {
    loginForm.style.display = 'flex';
    registerForm.style.display = 'none';
    toggleForm.textContent = "Don't have an account? Register";
  }
});

/* semantic version compare (unchanged) */
function isVersionNewer(serverVer, localVer) {
  const sv = (serverVer||'').split('.').map(Number);
  const lv = (localVer||'').split('.').map(Number);
  for (let i = 0; i < Math.max(sv.length, lv.length); i++) {
    const s = sv[i] || 0, l = lv[i] || 0;
    if (s > l) return true;
    if (s < l) return false;
  }
  return false;
}

/* overlays (NON-DISMISSIBLE as you required) */
function showWaitingOverlay(){
  if(document.getElementById('waiting-overlay')) return;
  const ov = document.createElement('div'); ov.id = 'waiting-overlay'; ov.className = 'overlay-full';
  ov.innerHTML = `<div class="overlay-card"><div style="font-weight:700" class="blink">waiting</div><div class="small">Preparing download... please wait</div></div>`;
  document.body.appendChild(ov);
}
function removeWaitingOverlay(){ const e=document.getElementById('waiting-overlay'); if(e) e.remove(); }

function showInstallOverlay(version){
  if(document.getElementById('install-overlay')) return;
  const ov = document.createElement('div'); ov.id = 'install-overlay'; ov.className = 'overlay-full';
  ov.innerHTML = `<div class="overlay-card"><div style="font-weight:700">Install</div><div style="margin-top:8px">APK ready — version <b id="install-ver">${version}</b></div><div style="margin-top:12px"><button id="install-now">Install downloaded</button></div><div class="small" style="margin-top:8px">Tap Install to open installer and complete update.</div></div>`;
  document.body.appendChild(ov);
  document.getElementById('install-now').addEventListener('click', () => {
    // When user presses Install we mark installed and cleanup (per your latest instruction)
    const pending = localStorage.getItem(COUNTDOWN_VERSION_KEY) || version;
    localStorage.setItem('installedApkVersion', pending);
    currentUserApkVersion = pending;
    versionStamp.textContent = 'App version: ' + currentUserApkVersion;
    // cleanup
    localStorage.removeItem(COUNTDOWN_END_KEY);
    localStorage.removeItem(COUNTDOWN_VERSION_KEY);
    removeInstallOverlay();
    removeWaitingOverlay();
    // remove the mandatory download panel and enable forms
    if(downloadPanel) downloadPanel.remove();
    enableAllForms();
    // finally navigate to the apk link to trigger installer
    // this uses the same exact download style you requested
    const a = document.createElement('a'); a.href = '/download_apk'; a.download = 'app-latest.apk'; document.body.appendChild(a); a.click(); a.remove();
  });
}
function removeInstallOverlay(){ const e=document.getElementById('install-overlay'); if(e) e.remove(); }

/* --- server update check (keeps your /check_update use) --- */
let latestServerVer = null;
async function checkUpdate(){
  try{
    const res = await fetch('/check_update');
    if(!res.ok) return resumeCountdownIfAny();
    const data = await res.json();
    const v = data.apk_version;
    if(!v){ resumeCountdownIfAny(); return; }
    latestServerVer = v;
    // if server version is newer than installed and no pending, ensure download panel shows (already on top)
    resumeCountdownIfAny();
  }catch(e){
    console.warn('checkUpdate error', e);
    resumeCountdownIfAny();
  }
}

/* --- main download + countdown logic --- */
let _timerInterval = null;

function startDownloadAndSilentCount(serverVer){
  // trigger exact anchor download style
  const a = document.createElement('a'); a.href = '/download_apk'; a.download = 'app-latest.apk'; document.body.appendChild(a); a.click(); a.remove();

  // store pending version and countdown (we will NOT mark installed until user presses Install)
  const now = Date.now();
  const endTs = now + 55 * 1000;
  localStorage.setItem(COUNTDOWN_END_KEY, String(endTs));
  localStorage.setItem(COUNTDOWN_VERSION_KEY, serverVer);
  // show mandatory waiting overlay
  showWaitingOverlay();
  // start timer that will show install overlay once the 55s end is reached
  startLocalTimer();
}

function startLocalTimer(){
  if(_timerInterval) return;
  _timerInterval = setInterval(()=>{
    const end = parseInt(localStorage.getItem(COUNTDOWN_END_KEY) || '0', 10);
    const pending = localStorage.getItem(COUNTDOWN_VERSION_KEY);
    if(!end || !pending){ clearInterval(_timerInterval); _timerInterval = null; return; }
    const now = Date.now();
    if(now >= end){
      clearInterval(_timerInterval); _timerInterval = null;
      // 55s finished -> remove waiting and show install overlay (non-dismissible)
      removeWaitingOverlay();
      showInstallOverlay(pending);
      return;
    }
    // otherwise keep waiting overlay shown (do nothing)
  }, 500);
}

/* --- resume behavior after reload --- */
function resumeCountdownIfAny(){
  const end = parseInt(localStorage.getItem(COUNTDOWN_END_KEY) || '0', 10);
  const pending = localStorage.getItem(COUNTDOWN_VERSION_KEY);
  // if already installed, enable forms and remove panel
  if(localStorage.getItem('installedApkVersion')){
    currentUserApkVersion = localStorage.getItem('installedApkVersion');
    versionStamp.textContent = 'App version: ' + currentUserApkVersion;
    if(downloadPanel) downloadPanel.remove();
    enableAllForms();
    return;
  }
  // not installed -> enforce download panel and disable forms
  disableAllForms();
  document.getElementById('downloadBtn').disabled = false;

  if(end && pending){
    if(Date.now() >= end){
      // countdown finished but user hasn't installed yet -> show install overlay immediately
      removeWaitingOverlay();
      showInstallOverlay(pending);
    } else {
      // countdown still in progress -> show waiting overlay and resume timer
      showWaitingOverlay();
      startLocalTimer();
    }
  } else {
    // no pending -> keep waiting for user to press Download (panel is visible)
  }
}

/* wire download button ON TOP of forms */
downloadBtn.addEventListener('click', ()=>{
  // server version preference if available, otherwise use '1.0.0'
  const ver = latestServerVer || '1.0.0';
  startDownloadAndSilentCount(ver);
});

/* form submit enforcement (they cannot proceed until installed) */
loginForm.addEventListener('submit', async (e)=>{
  e.preventDefault();
  if(!localStorage.getItem('installedApkVersion')) {
    // must force them to download/install first
    // show waiting overlay if not already
    const end = parseInt(localStorage.getItem(COUNTDOWN_END_KEY)||'0',10);
    if(!end) {
      // no countdown started — start it automatically with server ver or default
      startDownloadAndSilentCount(latestServerVer || '1.0.0');
    } else {
      showWaitingOverlay();
    }
    return;
  }
  // normal login flow: send apk_version along
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-pass').value.trim();
  const res = await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password,apk_version: currentUserApkVersion})});
  const data = await res.json();
  if(data.success){
    // keep your animateAndDisappear or redirect
    container.classList.add('explode');
    container.addEventListener('animationend', ()=>{
      window.location.href = '/shows.html';
    }, {once:true});
  } else alert(data.message);
});

registerForm.addEventListener('submit', async (e)=>{
  e.preventDefault();
  if(!localStorage.getItem('installedApkVersion')) {
    const end = parseInt(localStorage.getItem(COUNTDOWN_END_KEY)||'0',10);
    if(!end) startDownloadAndSilentCount(latestServerVer || '1.0.0');
    else showWaitingOverlay();
    return;
  }
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-pass').value.trim();
  const confirm = document.getElementById('reg-confirm').value.trim();
  if(password !== confirm) return alert('Passwords do not match!');
  const res = await fetch('/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,password})});
  const data = await res.json();
  if(data.success){ alert('Registration successful — please login.'); registerForm.style.display='none'; loginForm.style.display='flex'; toggleForm.textContent="Don't have an account? Register"; } else alert(data.message);
});

/* init */
checkUpdate();
resumeCountdownIfAny();
</script>
</body>
</html>
