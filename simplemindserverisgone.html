<!DOCTYPE html>
<html>
<head>
  <title>Secure Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      text-align: center;
      margin-top: 100px;
    }
    form {
      background: white;
      padding: 20px;
      border-radius: 10px;
      display: inline-block;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    input {
      padding: 10px;
      margin: 10px;
      font-size: 16px;
      width: 200px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Admin Login</h2>
  <form action="/simplemind_login" method="post">
    <input type="password" name="password" placeholder="Enter Password" required>
    <br>
    <button type="submit">Login</button>
  </form>
</body>
</html>
