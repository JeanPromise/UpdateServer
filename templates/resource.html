{% extends 'base.html' %}{% set page_title = post.title %}{% block content %}<section class="page-heading"><span class="section-kicker">{{ post.kind|upper }}</span><h1>{{ post.title }}</h1><p>{{ post.summary }}</p>{% if post.url %}<a href="{{ post.url }}" class="button" target="_blank" rel="noopener noreferrer">Open resource ↗</a>{% else %}<a href="{{ url_for('index') }}" class="button button-light">Back to home</a>{% endif %}</section>{% endblock %}
